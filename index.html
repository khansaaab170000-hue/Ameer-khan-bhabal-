<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="monetag" content="dfbeedbc211e04e62d123df9d3c19a8e">
<title>Ameer Khan Bhabal Game</title>
<script src="https://5gvci.com/act/files/tag.min.js?z=12178427" data-cfasync="false" async></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;text-align:center}
.box{width:100%;max-width:420px;height:100vh;margin:0 auto;display:flex;flex-direction:column;border:2px solid #00ff88}
.top{display:flex;justify-content:space-between;padding:12px;background:#111;color:#00ff88;font-weight:bold;font-size:18px}
#canvas{flex:1;width:100%;background:#000}
.start{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.96);display:flex;justify-content:center;align-items:center;flex-direction:column}
.btn{padding:18px 36px;background:#00ff88;color:#000;border:none;border-radius:14px;font-size:22px;font-weight:bold;margin-top:20px}
h1{color:#00ff88;font-size:32px}
</style>
</head>
<body>
<div class="box">
<div class="top"><span>Ameer Khan</span><span id="score">0</span></div>
<canvas id="canvas"></canvas>
</div>
<div class="start" id="startBox">
<h1>Bhabal Game</h1>
<p style="margin-top:10px">Tap to Play & Earn</p>
<button class="btn" onclick="playGame()">PLAY NOW 💰</button>
<p style="margin-top:15px;color:#888">Monetag Verified</p>
</div>
<script>
let s=0,playing=false;
function playGame(){
document.getElementById('startBox').style.display='none';
playing=true;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
canvas.width=420;canvas.height=700;
setInterval(()=>{
if(!playing)return;
s++;
document.getElementById('score').innerText=s;
ctx.fillStyle='#00ff88';
ctx.fillRect(Math.random()*400,Math.random()*680,20,20);
},80);
}
</script>
<script>(function(s){s.dataset.zone='9488094',s.src='https://groleegni.net/vignette.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
