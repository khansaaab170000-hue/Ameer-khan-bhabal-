<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Monetag Verification Tag -->
<meta name="monetag" content="dfbeedbc211e04e62d123df9d3c19a8e">
<title>Ameer Khan Bhabal Game</title>

<!-- Monetag Multitag Ads - Isse Earning Hogi -->
<script src="https://alwingulla.com/88/tag.min.js" data-zone="YOUR_ZONE_ID" async data-cfasync="false"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:100%;max-width:400px;height:90vh;background:#111;border-radius:15px;border:2px solid #00ff88;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 20px #00ff88}
.top{display:flex;justify-content:space-between;padding:12px 15px;background:#1a1a1a;border-bottom:2px solid #00ff88;color:#00ff88;font-weight:bold}
#canvas{flex:1;width:100%;background:radial-gradient(#111,#000);display:block}
.start{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;text-align:center}
.start h1{color:#00ff88;font-size:32px;margin-bottom:10px;text-shadow:0 0 15px #00ff88}
.start p{color:#aaa;margin-bottom:25px}
.btn{background:#00ff88;color:#000;border:none;padding:15px 35px;font-size:22px;font-weight:bold;border-radius:10px;cursor:pointer;box-shadow:0 0 15px #00ff88}
.btn:active{transform:scale(0.95)}
.score{font-size:18px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><span>👑 Ameer</span><span id="scoreDisplay">Score: 0</span><span>Bhabal</span></div>
  <canvas id="canvas"></canvas>
  <div class="start" id="startScreen">
    <h1>Ameer Bhabal</h1>
    <p>Tap to Play & Earn</p>
    <button class="btn" onclick="startGame()">PLAY GAME</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let score=0, gameRunning=false, player={x:50,y:100,w:30,h:30,vy:0};
let obstacles=[];

function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight-44;}
resize(); window.addEventListener('resize',resize);

function startGame(){
  document.getElementById('startScreen').style.display='none';
  score=0; obstacles=[]; player.y=canvas.height/2; player.vy=0; gameRunning=true;
  loop();
}
canvas.addEventListener('click',()=>{ if(gameRunning) player.vy=-8; });
document.addEventListener('keydown',(e)=>{ if(e.code==='Space' && gameRunning) player.vy=-8; });

function loop(){
  if(!gameRunning) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  player.vy+=0.5; player.y+=player.vy;
  if(player.y+player.h>canvas.height || player.y<0){ gameOver(); return; }
  ctx.fillStyle='#00ff88'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=10;
  ctx.fillRect(player.x,player.y,player.w,player.h); ctx.shadowBlur=0;

  if(Math.random()<0.02){ obstacles.push({x:canvas.width,y:Math.random()*(canvas.height-100),w:30,h:100}); }
  ctx.fillStyle='#ff0040';
  for(let i=obstacles.length-1;i>=0;i--){
    let ob=obstacles[i]; ob.x-=4;
    ctx.fillRect(ob.x,ob.y,ob.w,ob.h);
    if(player.x<ob.x+ob.w && player.x+player.w>ob.x && player.y<ob.y+ob.h && player.y+player.h>ob.y){ gameOver(); return; }
    if(ob.x+ob.w<0){ obstacles.splice(i,1); score++; document.getElementById('scoreDisplay').innerText='Score: '+score; }
  }
  requestAnimationFrame(loop);
}
function gameOver(){
  gameRunning=false;
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('startScreen').innerHTML=`<h1>Game Over</h1><p>Score: ${score}</p><button class="btn" onclick="startGame()">PLAY AGAIN</button>`;
}
</script>
</body>
</html>
